version: '3.8'

services:
  db:
    image: postgres:15
    container_name: crpas_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - crpas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: crpas_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      # Mount the entire project for development
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DB_HOST=db
      - DB_PORT=5432
    env_file:
      - .env
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crpas_network

volumes:
  postgres_data:
    driver: local

networks:
  crpas_network:
    driver: bridge
