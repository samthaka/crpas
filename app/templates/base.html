<!doctype>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}CRPAS{% endblock %}</title>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link  
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/index.css' %}" />
    <style>
      :root {
        --bg-dark: #08291a;
        --accent-green: rgb(0, 119, 26);
        --text-white: #ffffff;
        --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: block !important;
        justify-content: unset !important;
        align-items: unset !important;
        min-height: auto !important;
        background: #08291a;
        position: relative;
        flex-direction: unset !important;
      }

      /* Top Navigation Bar */
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        background: rgba(8, 41, 26, 0.95);
        border-bottom: 2px solid var(--accent-green);
        position: sticky;
        top: 0;
        z-index: 100;
        width: 100%;
      }

      .navbar-left {
        display: flex;
        gap: 30px;
        align-items: center;
      }

      .navbar-right {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .nav-link {
        color: var(--text-white);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .nav-link:hover {
        color: var(--accent-green);
      }

      .notification-bell {
        position: relative;
        cursor: pointer;
        font-size: 1.5rem;
        transition: transform 0.3s;
        color: var(--text-white);
      }

      .notification-bell:hover {
        transform: scale(1.1);
        color: var(--accent-green);
      }

      .notification-badge {
        position: absolute;
        top: -5px;
        right: -5px;
        background: #ff4444;
        color: white;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: bold;
      }

      /* Notification Panel */
      .notification-panel {
        position: fixed;
        right: -400px;
        top: 0;
        width: 400px;
        height: 100vh;
        background: var(--bg-dark);
        border-left: 2px solid var(--accent-green);
        box-shadow: -5px 0 20px rgba(0, 0, 0, 0.5);
        transition: right 0.3s ease;
        z-index: 200;
        overflow-y: auto;
      }

      .notification-panel.open {
        right: 0;
      }

      .panel-header {
        padding: 20px;
        border-bottom: 1px solid rgba(0, 119, 26, 0.3);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .panel-close {
        cursor: pointer;
        font-size: 1.5rem;
        transition: color 0.3s;
        color: var(--text-white);
      }

      .panel-close:hover {
        color: var(--accent-green);
      }

      .notification-item {
        padding: 15px 20px;
        border-bottom: 1px solid rgba(0, 119, 26, 0.2);
        cursor: pointer;
        transition: background 0.3s;
        color: var(--text-white);
      }

      .notification-item:hover {
        background: rgba(0, 119, 26, 0.15);
      }

      .notification-item.unread {
        background: rgba(0, 119, 26, 0.1);
        font-weight: 500;
      }

      .notification-time {
        font-size: 0.75rem;
        color: #aaa;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar">
      <div class="navbar-left">
        <h2 style="margin: 0; color: var(--text-white);">Crpas</h2>
        {% block navbar_link %}
        <a href="{% url 'conversation' %}" class="nav-link">
          <i class='bx bx-chat-left'></i> Chat With Our AI Advisor
        </a>
        {% endblock %}
      </div>
      <div class="navbar-right">
        <div class="notification-bell" onclick="toggleNotificationPanel()">
          <i class='bx bx-bell'></i>
          <span class="notification-badge" id="notification-count" style="display: none;">0</span>
        </div>
        <a href="{% url 'logout' %}" class="nav-link">
          <i class='bx bx-log-out'></i> Logout
        </a>
      </div>
    </nav>

    <!-- Notification Panel -->
    <div class="notification-panel" id="notification-panel">
      <div class="panel-header">
        <h3 style="margin: 0; color: var(--text-white);">Notifications</h3>
        <span class="panel-close" onclick="toggleNotificationPanel()">✕</span>
      </div>
      <div id="notification-list"></div>
    </div>

    <div class="py-3">
      {% block content %} {% endblock %}
    </div>
    <style>
      .py-3 {
        min-height: calc(100vh - 80px);
        padding: 20px;
      }
    </style>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script>
      function toggleNotificationPanel() {
        const panel = document.getElementById('notification-panel');
        panel.classList.toggle('open');
      }

      // Close notification panel when clicking outside
      document.addEventListener('click', function(event) {
        const panel = document.getElementById('notification-panel');
        const bell = document.querySelector('.notification-bell');
        if (!panel.contains(event.target) && !bell.contains(event.target)) {
          panel.classList.remove('open');
        }
      });

      // Fetch notifications from backend (implement in your backend)
      function fetchNotifications() {
        // TODO: Implement notification fetching from backend
        // Update notification count and list
      }

      // Call fetchNotifications on page load
      window.addEventListener('load', fetchNotifications);
    </script>
  </body>
</html>
