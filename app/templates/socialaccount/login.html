{% extends "base.html" %} {% load socialaccount %} {% block title %}Sign In -
CRPAS{% endblock %} {% block content %}
<div class="oauth-container">
  <div class="oauth-card">
    <div class="oauth-header">
      <h2>Welcome Back</h2>
      <p>Sign in to your CRPAS account</p>
    </div>

    <div class="oauth-content">
      <form method="post" action="/accounts/google/login/">
        {% csrf_token %}
        <button type="submit" class="oauth-button google-button">
          <svg
            class="oauth-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M12.545,10.332v3.109h5.769c-0.254,1.313,-1.082,2.418,-2.288,3.156v2.884h3.703 c2.148,-1.98,3.387,-4.897,3.387,-8.335c0,-0.514,-0.05,-1.014,-0.131,-1.508H12.545Z"
              fill="#4285F4"
            />
            <path
              d="M9.996,19.328c1.331,0.823,2.887,1.313,4.532,1.313c3.169,0,5.841,-1.017,7.769,-2.99 l-3.703,-2.884c-1.018,0.682,-2.318,1.082,-4.066,1.082c-3.122,0,-5.76,-2.104,-6.708,-4.941H3.122v2.978 C4.933,17.394,7.271,19.328,9.996,19.328Z"
              fill="#34A853"
            />
            <path
              d="M3.122,12.882c-0.164,-0.531,-0.264,-1.097,-0.264,-1.682c0,-0.586,0.1,-1.151,0.264,-1.682V6.46H0.304 c-0.511,1.043,-0.799,2.208,-0.799,3.46c0,1.252,0.288,2.417,0.799,3.46L3.122,12.882Z"
              fill="#FBBC05"
            />
            <path
              d="M9.996,3.882c1.875,0,3.558,0.645,4.889,1.911l3.665,-3.665C15.834,0.513,13.161,-0.499,9.996,-0.499 c-2.725,0,-5.063,1.934,-6.872,4.807l2.818,2.187C4.236,5.986,6.874,3.882,9.996,3.882Z"
              fill="#EA4335"
            />
          </svg>
          <span>Continue with Google</span>
        </button>
      </form>

      <div class="divider">
        <span>Or</span>
      </div>

      <a href="{% url 'auth' %}" class="oauth-button email-button">
        <svg
          class="oauth-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
          />
          <polyline points="22,6 12,13 2,6" />
        </svg>
        <span>Sign in with Email</span>
      </a>

      <a href="{% url 'phone_auth' %}" class="oauth-button phone-button">
        <svg
          class="oauth-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
          />
        </svg>
        <span>Sign in with Phone</span>
      </a>
    </div>

    <div class="oauth-footer">
      <p>
        Don't have an account?
        <a href="{% url 'auth' %}#signup">Sign up here</a>
      </p>
    </div>
  </div>

  <style>
    .oauth-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #08291a 0%, #0f3d26 100%);
      padding: 20px;
    }

    .oauth-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }

    .oauth-header {
      background: linear-gradient(135deg, #08291a 0%, #0f3d26 100%);
      color: white;
      padding: 40px 30px;
      text-align: center;
    }

    .oauth-header h2 {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .oauth-header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.9;
      font-weight: 500;
    }

    .oauth-content {
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .oauth-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
      text-align: center;
      width: 100%;
      background: none;
    }

    .oauth-content form {
      margin: 0;
      padding: 0;
    }

    .oauth-content form button.oauth-button {
      width: 100%;
    }

    .google-button {
      background: white;
      color: #1f2937;
      border: 2px solid #e5e7eb;
    }

    .google-button:hover {
      background: #f9fafb;
      border-color: #4285f4;
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.15);
      transform: translateY(-2px);
    }

    .email-button {
      background: linear-gradient(135deg, #08291a 0%, #0f3d26 100%);
      color: white;
      border: 2px solid transparent;
    }

    .email-button:hover {
      background: linear-gradient(135deg, #0a3421 0%, #114d30 100%);
      box-shadow: 0 4px 12px rgba(8, 41, 26, 0.25);
      transform: translateY(-2px);
    }

    .phone-button {
      background: white;
      color: #0077ff;
      border: 2px solid #0077ff;
    }

    .phone-button:hover {
      background: #f0f8ff;
      box-shadow: 0 4px 12px rgba(0, 119, 255, 0.15);
      transform: translateY(-2px);
    }

    .oauth-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
      color: #9ca3af;
      font-size: 13px;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .oauth-footer {
      padding: 20px 30px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
      background: #f9fafb;
    }

    .oauth-footer p {
      margin: 0;
      font-size: 14px;
      color: #6b7280;
    }

    .oauth-footer a {
      color: #08291a;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s;
    }

    .oauth-footer a:hover {
      color: #0077ff;
    }

    @media (max-width: 480px) {
      .oauth-card {
        border-radius: 12px;
      }

      .oauth-header {
        padding: 30px 20px;
      }

      .oauth-header h2 {
        font-size: 24px;
      }

      .oauth-content {
        padding: 30px 20px;
      }

      .oauth-button {
        padding: 12px 16px;
        font-size: 14px;
      }

      .oauth-icon {
        width: 18px;
        height: 18px;
      }

      .oauth-footer {
        padding: 16px 20px;
      }
    }
  </style>
</div>
{% endblock %}
