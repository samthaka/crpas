{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set Password - CRPAS</title>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Toastr CSS for notifications -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
    />
    <link rel="stylesheet" href="{% static 'css/index.css' %}" />
    <style>
      .password-setup-container {
        max-width: 450px;
        margin: 50px auto;
        padding: 40px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      }
      .password-setup-header {
        text-align: center;
        margin-bottom: 40px;
      }
      .password-setup-header h2 {
        color: #007726;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .password-setup-header p {
        color: #666;
        margin: 0;
      }
      .phone-display {
        background-color: #f5f5f5;
        padding: 10px 15px;
        border-radius: 5px;
        text-align: center;
        font-weight: bold;
        color: #333;
        margin-bottom: 30px;
      }
      .form-label {
        color: #333;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .form-control {
        padding: 12px 15px;
        font-size: 16px;
        border: 2px solid #e0e0e0;
        transition: border-color 0.3s ease;
      }
      .form-control:focus {
        border-color: #007726;
        box-shadow: 0 0 0 0.2rem rgba(0, 119, 38, 0.1);
      }
      .form-text {
        color: #999;
        font-size: 12px;
        margin-top: 5px;
      }
      .btn-set-password {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        font-weight: bold;
        background-color: #007726;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-top: 20px;
      }
      .btn-set-password:hover {
        background-color: #005a1f;
        color: white;
        text-decoration: none;
      }
      .password-requirements {
        background-color: #f0f0f0;
        padding: 15px;
        border-radius: 5px;
        margin: 20px 0;
        font-size: 14px;
      }
      .password-requirements h5 {
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
        font-size: 14px;
      }
      .requirement {
        margin: 5px 0;
        color: #666;
      }
      .requirement i {
        margin-right: 8px;
      }
      .requirement.met {
        color: #28a745;
      }
      .requirement.met i {
        color: #28a745;
      }
    </style>
  </head>
  <body style="background: linear-gradient(135deg, #f5f5f5 0%, #e8f5e9 100%)">
    <div class="password-setup-container">
      <div class="password-setup-header">
        <h2>Set Your Password</h2>
        <p>Create a password to secure your account</p>
      </div>

      <div class="phone-display"><i class="bx bxs-phone"></i> {{ phone }}</div>

      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <label for="password1" class="form-label">
            <i class="bx bxs-lock-alt"></i> Password
          </label>
          <input
            type="password"
            name="password1"
            id="password1"
            class="form-control"
            placeholder="Enter a strong password"
            autocomplete="new-password"
            required
          />
          <div class="form-text">
            Your password must be at least 8 characters long.
          </div>
        </div>

        <div class="mb-3">
          <label for="password2" class="form-label">
            <i class="bx bxs-lock-alt"></i> Confirm Password
          </label>
          <input
            type="password"
            name="password2"
            id="password2"
            class="form-control"
            placeholder="Confirm your password"
            autocomplete="new-password"
            required
          />
          <div class="form-text">
            Enter the same password as above for verification.
          </div>
        </div>

        <div class="password-requirements">
          <h5>Password Requirements:</h5>
          <div class="requirement" id="length-req">
            <i class="bx bx-circle" id="length-icon"></i> At least 8 characters
          </div>
          <div class="requirement" id="match-req">
            <i class="bx bx-circle" id="match-icon"></i> Passwords match
          </div>
        </div>

        <button type="submit" class="btn-set-password">
          <i class="bx bxs-check-circle"></i> Set Password & Continue
        </button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Toastr JS for notifications -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <script>
      const password1Input = document.getElementById('password1');
      const password2Input = document.getElementById('password2');
      const lengthReq = document.getElementById('length-req');
      const matchReq = document.getElementById('match-req');
      const lengthIcon = document.getElementById('length-icon');
      const matchIcon = document.getElementById('match-icon');

      function validatePasswords() {
        const password1 = password1Input.value;
        const password2 = password2Input.value;

        // Check length requirement
        if (password1.length >= 8) {
          lengthReq.classList.add('met');
          lengthIcon.className = 'bx bx-check-circle';
        } else {
          lengthReq.classList.remove('met');
          lengthIcon.className = 'bx bx-circle';
        }

        // Check if passwords match
        if (password1 && password2 && password1 === password2) {
          matchReq.classList.add('met');
          matchIcon.className = 'bx bx-check-circle';
        } else if (password1 && password2) {
          matchReq.classList.remove('met');
          matchIcon.className = 'bx bx-circle';
        } else {
          matchReq.classList.remove('met');
          matchIcon.className = 'bx bx-circle';
        }
      }

      password1Input.addEventListener('input', validatePasswords);
      password2Input.addEventListener('input', validatePasswords);

      // Wait for Toastr to be loaded before configuring
      if (typeof toastr !== 'undefined') {
        toastr.options = {
          closeButton: true,
          progressBar: true,
          positionClass: "toast-top-right",
          timeOut: 4000,
          extendedTimeOut: 2000,
        };
      }

      // Display Django messages as toasts
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof toastr !== 'undefined') {
          {% if messages %}
            {% for message in messages %}
              var messageText = "{{ message }}";
              var messageTags = "{{ message.tags }}";

              // Map Django message tags to Toastr methods
              if (messageTags.includes("error")) {
                toastr.error(messageText, "Error!");
              } else if (messageTags.includes("success")) {
                toastr.success(messageText, "Success!");
              } else if (messageTags.includes("warning")) {
                toastr.warning(messageText, "Warning!");
              } else {
                toastr.info(messageText, "Info");
              }
            {% endfor %}
          {% endif %}
        }
      });
    </script>
  </body>
</html>
