<!DOCTYPE html>
<html>
<head>
    <title>CRPAS Advisory - {{ farmer.fname }} {{ farmer.lname }}</title>
    <style>
        body { font-family: Arial; margin: 20px; max-width: 800px; }
        .advisory { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; border-radius: 8px; margin: 20px 0; white-space: pre-wrap; }
        .section { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>CRPAS Advisory</h1>
    <h2>{{ farmer.fname }} {{ farmer.lname }} ({{ farmer.phone }}) - {{ farmer.get_crop_type_display }}</h2>
    <p>Location: {{ farmer.lat }}, {{ farmer.long }}</p>

    <div class="section">
        <h3>Latest Advisory</h3>
        <div class="advisory">{{ advisory }}</div>
    </div>

    <!-- Optional: Raw data for debugging -->
    <div class="section">
        <h3>Forecast Data (last 10 days)</h3>
        <pre>{{ forecast | safe }}</pre>
    </div>

    <p><a href="{% url 'farmer_list' %}">Back to Farmers List</a> | <a href="{% url 'admin:index' %}">Admin</a></p>
</body>
</html>
